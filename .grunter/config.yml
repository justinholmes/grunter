deploy_branch: main
tf_binary: opentofu
tg_binary: terragrunt
ignore:
  - "**/.terraform.lock.hcl"
  - "**/README.md"

# Optional: define environments for env-aware commands (envdiff, promote, --env flag).
# Order defines the promotion sequence for progressive deployments.
# environments:
#   - name: dev
#     path: envs/dev
#     regions:
#       - us-east-1
#       - eu-west-1
#   - name: staging
#     path: envs/staging
#     regions:
#       - us-east-1
#     # Destroy protection — block all destroys in staging
#     # max_destroy: 0
#     # RFC verification (GitLab-based)
#     rfc:
#       source: gitlab
#       approved_label: rfc-approved
#       issue_approved_label: "status::approved"
#       emergency_label: emergency
#     # Restrict deployments to business hours
#     deployment_window:
#       days: [monday, tuesday, wednesday, thursday, friday]
#       start: "09:00"
#       end: "17:00"
#       timezone: UTC
#   - name: prod
#     path: envs/prod
#     regions:
#       - us-east-1
#       - eu-west-1
#     approval_group: platform-approvers
#     # Destroy protection — allow up to 5 destroys per unit
#     # max_destroy: 5
#     # RFC verification (ServiceNow-based)
