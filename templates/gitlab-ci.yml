stages:
  - detect
  - plan
  - apply
  - promote

variables:
  GRUNTER_CONFIG: ".grunter/config.yml"

# Detect changed units and output execution plan
detect:
  stage: detect
  image: ${GRUNTER_IMAGE:-ghcr.io/justinholmes/grunter:latest}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - grunter orchestrate --config "$GRUNTER_CONFIG" -o execution-plan.json
  artifacts:
    paths:
      - execution-plan.json
    expire_in: 1 day

# Run terragrunt plan on each changed unit and post results to MR
plan:
  stage: plan
  image: ${GRUNTER_IMAGE:-ghcr.io/justinholmes/grunter:latest}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  needs:
    - detect
  script:
    - |
      # Read each unit from the execution plan and run plan
      for unit in $(jq -r '.layers[].units[].path' execution-plan.json); do
        echo "Planning: $unit"
        grunter execute plan "$unit" --config "$GRUNTER_CONFIG" -o "plan-${unit//\//-}.txt" || true
        grunter comment \
          --input "plan-${unit//\//-}.txt" \
          --unit "$unit" \
          --action plan \
          --config "$GRUNTER_CONFIG"
      done

# (Optional) Post envdiff results to MR for cross-environment visibility
.envdiff:
  stage: plan
  image: ${GRUNTER_IMAGE:-ghcr.io/justinholmes/grunter:latest}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  needs:
    - detect
  script:
    - grunter envdiff dev prod --config "$GRUNTER_CONFIG" -o envdiff-report.md
  artifacts:
    paths:
      - envdiff-report.md
    expire_in: 1 day

# Run terragrunt apply on merge to deploy branch (simple mode)
apply:
  stage: apply
  image: ${GRUNTER_IMAGE:-ghcr.io/justinholmes/grunter:latest}
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - detect
  script:
    - |
      # Read each unit from the execution plan and apply in order
      for unit in $(jq -r '.layers[].units[].path' execution-plan.json); do
        echo "Applying: $unit"
        grunter execute apply "$unit" --config "$GRUNTER_CONFIG"
      done

# --- Progressive deployment (canary-style) ---
# Use these jobs instead of `apply` when environments are configured.
# `promote` generates a staged deployment plan; downstream jobs execute each stage.

.promote:
  stage: promote
  image: ${GRUNTER_IMAGE:-ghcr.io/justinholmes/grunter:latest}
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - detect
  script:
    - grunter promote --config "$GRUNTER_CONFIG" --json -o promote-plan.json
    - |
      # Execute each stage in the progressive deployment plan
      stage_count=$(jq '.stages | length' promote-plan.json)
      for i in $(seq 0 $((stage_count - 1))); do
        env=$(jq -r ".stages[$i].environment" promote-plan.json)
        region=$(jq -r ".stages[$i].region // empty" promote-plan.json)
        is_canary=$(jq -r ".stages[$i].is_canary" promote-plan.json)

        echo "=== Stage $((i+1)): $env ${region:+($region)} ${is_canary:+(canary)} ==="

        for unit in $(jq -r ".stages[$i].layers[].units[].path" promote-plan.json); do
          echo "Applying: $unit"
          grunter execute apply "$unit" --config "$GRUNTER_CONFIG"
        done

        # Gate between canary and full rollout (add approval logic here)
        if [ "$is_canary" = "true" ]; then
          echo "Canary stage complete. Verify before proceeding."
        fi
      done
  artifacts:
    paths:
      - promote-plan.json
    expire_in: 1 day
